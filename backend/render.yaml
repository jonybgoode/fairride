# Render.com deployment spec for the FairRide backend.
#
# DEMO CREDENTIALS: DATABASE_URL and JWT_SECRET below are the real values for
# the demo database, committed on purpose for this demo project. The URL uses
# Render's INTERNAL hostname, so it only works from a Render service in the
# same region as that database (not from a laptop — use the database's
# External URL in backend/.env for local runs).
#
# HOW RENDER APPLIES THIS FILE: only through a Blueprint (New > Blueprint).
# The live backend was created as a regular Web Service, which ignores this
# file and reads its environment variables from the dashboard
# (service > Environment). A git push alone does not apply the values below.
#
# Manual path (recommended for this repo layout):
#   1. Render dashboard -> New + -> Web Service
#   2. Connect this GitHub repository
#   3. Root Directory: backend
#      Build Command:  npm install
#      Start Command:  node server.js
#      Instance Type:  Free
#   4. New + -> PostgreSQL: create a database in the SAME region as the service
#   5. Web Service -> Environment: add DATABASE_URL and JWT_SECRET (values
#      below), then save and deploy
#   6. The service lives at https://<service-name>.onrender.com (Render adds
#      a random suffix if the name is taken) and redeploys on every git push.
#
# Blueprint path: New > Blueprint -> connect this repository and set the
# Blueprint Path to backend/render.yaml. Only a Blueprint applies this file.

services:
  - type: web
    name: fairride-backend        # becomes https://fairride-backend-<suffix>.onrender.com
    runtime: node
    plan: free
    # rootDir: backend            # only needed if this file is at repo root
    buildCommand: npm install
    startCommand: node server.js  # server binds to $PORT automatically
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: postgresql://fairride_db_user:AuM4zFBkol7k0T5YR012uCcqTPNAwmMu@dpg-dc527s49v7es738t4ktg-a/fairride_db
      - key: JWT_SECRET
        value: 05bdc86ce0c8b33a465c676d8f17f8f81e7494a8b95114fcf636b2fae4cc2a0fb49545228dc763b8ea0f076701971f14
