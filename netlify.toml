# Netlify configuration for the FairRide frontend.
#
# The frontend is fully static (a single index.html, no build step), so the
# easiest deploy is drag-and-drop: drop this repository folder onto
# https://app.netlify.com/drop
#
# BEFORE deploying, replace the placeholder backend URL below with your
# live Render URL (see backend/render.yaml). Keep _redirects in sync.

[build]
  publish = "."

# Proxy backend traffic so the frontend can use same-origin URLs: the page
# connects to "/api/..." and "/socket.io/..." (relative), and Netlify
# forwards them to the backend — including WebSocket upgrades.
[[redirects]]
  from = "/api/*"
  to = "https://fairride-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/socket.io/*"
  to = "https://fairride-backend.onrender.com/socket.io/:splat"
  status = 200
